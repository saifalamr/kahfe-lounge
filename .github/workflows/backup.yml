name: Private encrypted database and image backup
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/backup*.mjs', '.github/workflows/backup.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Upload encrypted backup to private storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs
